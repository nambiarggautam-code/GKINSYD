            .staticrypt-html, .staticrypt-body { height: 100%; margin: 0; }

            .staticrypt-instructions { margin-bottom: 1.6em; }

                font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; font-weight: 500;
                font-size: 2.6em; line-height: 1.1; margin: 0 0 .35em; letter-spacing: .01em;
            }

            .staticrypt-hr { border: 0; border-top: 1px solid #d9cfbf; width: 64px; margin: 0 auto 1.8em; }
            .staticrypt-password-container {
                position: relative; background: #fffdf9; border: 1px solid #d9cfbf; border-radius: 2px;
                margin: 0 0 14px; box-sizing: border-box;

            .staticrypt-form input[type="password"], input[type="text"] {
                background: transparent; border: 0; box-sizing: border-box; color: #242424;
                font-size: 16px; outline: 0; padding: 14px 44px 14px 14px; width: 100%;
            }
            .staticrypt-password-container:focus-within { border-color: #783D46; }
            .staticrypt-toggle-password-visibility {

                right: 0; top: 50%; transform: translateY(-50%); width: 20px;
            }
            label.staticrypt-remember {

            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus { filter: brightness(88%); outline: 0; }
            .staticrypt-error { color: #783D46; font-style: italic; font-family: "Cormorant Garamond", Georgia, serif;

            .hidden { display: none !important; }

        </style>
