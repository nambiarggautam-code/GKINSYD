            .staticrypt-form input[type="password"], input[type="text"] {

            }
            .staticrypt-password-container:focus-within { border-color: #783D46; }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; height: 20px; opacity: .45; padding: 12px; position: absolute;
                right: 0; top: 50%; transform: translateY(-50%); width: 20px;
            }
            label.staticrypt-remember {
                display: flex; align-items: center; justify-content: center; gap: .6em;
                font-size: .9em; color: #4A4744; margin: 4px 0 18px;
            }
            .staticrypt-remember input[type="checkbox"] { accent-color: #783D46; transform: scale(1.25); }
            .staticrypt-form .staticrypt-decrypt-button {
                background: /*[|template_color_primary|]*/ 0; color: #F6F1E8; border: 0; border-radius: 2px;
                width: 100%; padding: 14px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
                cursor: pointer; font-family: inherit;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus { filter: brightness(88%); outline: 0; }
            .staticrypt-error { color: #783D46; font-style: italic; font-family: "Cormorant Garamond", Georgia, serif;
                font-size: 1.1em; margin: 0 0 12px; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center;
                background: /*[|template_color_secondary|]*/ 0; }
            .staticrypt-spinner { display: inline-block; width: 1.6rem; height: 1.6rem; border: .2em solid #783D46;

            @keyframes spinner-border { 100% { transform: rotate(360deg); } }

        <script>

                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                const err = document.getElementById("staticrypt-error");
                if (!isSuccessful) {
                    err.textContent = templateError;
                    err.classList.remove("hidden");
                    document.getElementById("staticrypt-password").select();
                } else {
                    err.classList.add("hidden");
                }
